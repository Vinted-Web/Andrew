<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f6b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Garderie"><title>Garderie</title>
<link id="appIcon" rel="apple-touch-icon"><link id="favicon" rel="icon"><link id="manifestLink" rel="manifest">
<style>:root{--g:#087f6b;--g2:#11a98d;--n:#183f59;--bg:#f2f7f6;--line:#d7e6e2;--mut:#667b76;--red:#c74747}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#d9f5ed,transparent 34%),var(--bg);color:#173630;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:86px}header{position:sticky;top:0;z-index:5;padding:calc(17px + env(safe-area-inset-top)) 18px 15px;background:linear-gradient(135deg,var(--n),var(--g));color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 5px 18px #183f5930}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;background:#ffffff25;border-radius:13px;display:grid;place-items:center;font-size:24px}h1{font-size:20px;margin:0}.sub{font-size:11px;opacity:.8}.rate{font-size:12px;font-weight:800;background:#ffffff22;padding:8px 10px;border-radius:99px}main{width:100%;max-width:540px;margin:auto;padding:18px 15px;overflow-x:hidden}.view{display:none}.view.on{display:block}.card{width:100%;max-width:100%;min-width:0;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px #183f5914}h2{font-size:16px;color:var(--n);margin:0 0 15px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#edf3f1;padding:5px;border-radius:14px;margin-bottom:16px}button{border:0;font:inherit;cursor:pointer}.mode{padding:11px;border-radius:10px;background:transparent;color:var(--mut);font-weight:800}.mode.on[data-m=matin]{background:#fff1d6;color:#925800}.mode.on[data-m=soir]{background:#ebefff;color:#4054a6}label{font-size:12px;color:var(--mut);font-weight:700;display:block;margin:12px 0 6px}input{display:block;width:100%;max-width:100%;min-width:0;padding:13px;border:1px solid var(--line);border-radius:11px;font-size:16px;background:#fbfdfc}.panel{width:100%;max-width:100%;min-width:0;overflow:hidden;padding:14px;border-radius:15px;margin-top:15px}.panel.matin{background:#fff5df}.panel.soir{background:#edf0ff}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.chip{padding:11px;background:#ecf8f5;border-radius:12px;text-align:center}.chip b{display:block;color:var(--g);font-size:17px}.chip small{color:var(--mut)}.save{width:100%;padding:14px;border-radius:11px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-weight:800}.status{text-align:center;font-size:12px;color:var(--mut);margin-top:10px}.entry{padding:14px 0;border-bottom:1px solid var(--line)}.top,.times,.actions{display:flex;justify-content:space-between;gap:8px;align-items:center}.date{font-weight:800;color:var(--n)}.amount{font-weight:900;color:var(--g)}.times{margin-top:9px}.tag{flex:1;padding:8px;border-radius:9px;font-size:12px}.am{background:#fff3dc;color:#80500a}.pm{background:#edf0ff;color:#4359aa}.default{opacity:.6;font-style:italic}.actions{margin-top:9px;justify-content:flex-end}.edit,.del{padding:8px 11px;border-radius:9px;font-size:12px;font-weight:800}.edit{color:var(--g);background:#eaf8f4}.del{color:var(--red);background:#fff0f0}.empty{text-align:center;color:var(--mut);padding:25px}.stat{font-size:30px;font-weight:900;color:var(--g)}nav{position:fixed;bottom:0;left:0;right:0;z-index:8;display:flex;background:#fffffff2;border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}nav button{flex:1;background:transparent;color:var(--mut);padding:6px;font-size:11px}nav button.on{color:var(--g);font-weight:900}nav span{display:block;font-size:20px}.modal{display:none;position:fixed;inset:0;z-index:30;background:#17363088;padding:20px;align-items:center;justify-content:center}.modal.on{display:flex}.box{background:#fff;border-radius:20px;padding:22px;max-width:400px;width:100%;box-shadow:0 25px 60px #0004}.box h3{margin:0 0 8px;color:var(--n)}.box p{color:var(--mut);font-size:14px;line-height:1.45}.box .actions{display:grid;grid-template-columns:1fr 1fr;margin-top:18px}.cancel,.confirm{padding:12px;border-radius:10px;font-weight:800}.cancel{background:#edf3f1}.confirm{background:var(--red);color:#fff}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:11px 16px;border-radius:99px;opacity:0;z-index:50;transition:.2s;white-space:nowrap;font-size:13px}.toast.on{opacity:1}</style></head><body>
<header><div class="brand"><div class="logo">✓</div><div><h1>Garderie</h1><div class="sub">Suivi des temps de garde</div></div></div><div class="rate">3,90 € / h</div></header><main>
<section id="saisie" class="view on"><div class="card"><h2>Nouveau pointage</h2><div class="switch"><button class="mode on" data-m="matin">☀ Matin</button><button class="mode" data-m="soir">☾ Soir</button></div><label>Date</label><input id="date" type="date"><div id="pmatin" class="panel matin"><label>Heure d'arrivée</label><input id="matin" type="time" min="07:00" max="08:15"></div><div id="psoir" class="panel soir" hidden><label>Heure de départ</label><input id="soir" type="time" min="16:30" max="19:00"></div><div class="summary"><div class="chip"><b id="duree">0 h 00</b><small>temps calculé</small></div><div class="chip"><b id="montant">0,00 €</b><small>montant estimé</small></div></div><button id="save" class="save">Enregistrer le pointage du matin</button><div id="status" class="status">Connexion à Supabase…</div></div></section>
<section id="historique" class="view"><div class="card"><h2>Historique consolidé</h2><div id="list"></div></div></section>
<section id="stats" class="view"><div class="card"><h2>Statistiques mensuelles</h2><label>Mois</label><input id="month" type="month"><label>Total du mois</label><div><span id="hours" class="stat">0,0</span> heures</div><div><span id="euros" class="stat">0,00</span> €</div><div id="days" class="status"></div></div></section></main>
<nav><button class="nav on" data-v="saisie"><span>✎</span>Pointer</button><button class="nav" data-v="historique"><span>☰</span>Historique</button><button class="nav" data-v="stats"><span>◔</span>Stats</button></nav><div id="modal" class="modal"><div class="box"><h3 id="mtitle"></h3><p id="mtext"></p><div class="actions"><button id="cancel" class="cancel">Annuler</button><button id="confirm" class="confirm">Confirmer</button></div></div></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://ewbsiruuxbzjznhauoxf.supabase.co',KEY='sb_publishable_G9KENK1gfHJ9r246Tgx5Dw_vsXBD3FG',TABLE='Andrew',RATE=3.9;let rows=[],mode='matin',pending=null;
const $=s=>document.querySelector(s), api=async(path='',opt={})=>{let r=await fetch(SUPABASE_URL+'/rest/v1/'+TABLE+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});if(!r.ok)throw Error((await r.text())||r.status);return r.status===204?[]:r.json()};
function icon(){let c=document.createElement('canvas');c.width=c.height=512;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,512,512);g.addColorStop(0,'#183f59');g.addColorStop(1,'#0ba98d');x.fillStyle=g;x.roundRect(0,0,512,512,105);x.fill();x.fillStyle='#fff';x.font='bold 300px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('✓',256,275);let u=c.toDataURL('image/png');$('#appIcon').href=u;$('#favicon').href=u;let m={name:'Garderie',short_name:'Garderie',start_url:location.href,display:'standalone',background_color:'#f3f7f6',theme_color:'#087f6b',icons:[{src:u,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};$('#manifestLink').href=window.URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))}icon();
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}function ask(t,p,label,fn){$('#mtitle').textContent=t;$('#mtext').textContent=p;$('#confirm').textContent=label;pending=fn;$('#modal').classList.add('on')}$('#cancel').onclick=()=>{$('#modal').classList.remove('on');pending=null};$('#confirm').onclick=()=>{let f=pending;$('#modal').classList.remove('on');pending=null;if(f)f()};
function mins(v){if(!v)return 0;let p=v.slice(0,5).split(':').map(Number);return p[0]*60+p[1]}function calc(type,v){return type==='matin'?Math.max(0,495-mins(v))/60:Math.max(0,mins(v)-990)/60}function fmt(h){let n=Math.round(h*60);return Math.floor(n/60)+' h '+String(n%60).padStart(2,'0')}function money(v){return v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function grouped(){let g={};rows.forEach(r=>{g[r.date_pointage]??={};g[r.date_pointage][r.type_pointage]={...r,heure:String(r.heure).slice(0,5)}});return g}async function load(){try{rows=await api('?select=id,date_pointage,type_pointage,heure&order=date_pointage.desc');$('#status').textContent='Données synchronisées';render()}catch(e){$('#status').textContent='Erreur de connexion';toast('Erreur Supabase : '+e.message)}}
function render(){let g=grouped(),list=$('#list'),dates=Object.keys(g).sort().reverse();list.innerHTML=dates.length?'':'<div class="empty">Aucune donnée</div>';dates.forEach(d=>{let a=g[d].matin,s=g[d].soir,av=a?a.heure:'08:15',sv=s?s.heure:'16:30',h=calc('matin',av)+calc('soir',sv),el=document.createElement('div');el.className='entry';el.innerHTML=`<div class="top"><div class="date">${new Date(d+'T00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}</div><div class="amount">${money(h*RATE)}</div></div><div class="times"><div class="tag am">☀ ${av}${a?'':' <i class="default">défaut</i>'}</div><div class="tag pm">☾ ${sv}${s?'':' <i class="default">défaut</i>'}</div></div><div class="actions"><button class="edit">Modifier</button><button class="del">Supprimer</button></div>`;el.querySelector('.edit').onclick=()=>{switchView('saisie');$('#date').value=d;setMode(a?'matin':'soir');$('#matin').value=a?.heure||'';$('#soir').value=s?.heure||'';update()};el.querySelector('.del').onclick=()=>ask('Supprimer la journée','Les saisies du matin et du soir seront supprimées.','Supprimer',async()=>{try{await api('?date_pointage=eq.'+d,{method:'DELETE'});await load();toast('Journée supprimée')}catch(e){toast('Erreur : '+e.message)}});list.appendChild(el)});stats()}
function stats(){let g=grouped(),m=$('#month').value,total=0,n=0;Object.keys(g).filter(d=>d.startsWith(m)).forEach(d=>{let a=g[d].matin,s=g[d].soir;total+=calc('matin',a?a.heure:'08:15')+calc('soir',s?s.heure:'16:30');n++});$('#hours').textContent=total.toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1});$('#euros').textContent=(total*RATE).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});$('#days').textContent=n+' journée'+(n>1?'s':'')+' pointée'+(n>1?'s':'')}
function setMode(m){mode=m;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.m===m));$('#pmatin').hidden=m!=='matin';$('#psoir').hidden=m!=='soir';$('#save').textContent='Enregistrer le pointage du '+m;update()}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.m));function update(){let v=mode==='matin'?$('#matin').value:$('#soir').value,h=calc(mode,v);$('#duree').textContent=fmt(h);$('#montant').textContent=money(h*RATE)}$('#matin').oninput=$('#soir').oninput=update;
$('#save').onclick=async function(){let d=$('#date').value,v=mode==='matin'?$('#matin').value:$('#soir').value;if(!d||!v)return toast('Date et heure obligatoires');if(mode==='matin'&&(v<'07:00'||v>'08:15'))return toast('Matin : entre 07h00 et 08h15');if(mode==='soir'&&(v<'16:30'||v>'19:00'))return toast('Soir : entre 16h30 et 19h00');let old=rows.find(r=>r.date_pointage===d&&r.type_pointage===mode),save=async()=>{try{this.disabled=true;if(old)await api('?id=eq.'+old.id,{method:'PATCH',body:JSON.stringify({heure:v})});else await api('',{method:'POST',body:JSON.stringify({date_pointage:d,type_pointage:mode,heure:v})});if(mode==='matin')$('#matin').value='';else $('#soir').value='';update();await load();toast('Pointage enregistré')}catch(e){toast('Erreur : '+e.message)}finally{this.disabled=false}};old?ask('Saisie déjà existante',`Un pointage ${mode} existe déjà pour cette date.`,`Écraser`,save):save()};
function switchView(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.v===v));if(v==='historique')load();if(v==='stats')stats()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>switchView(b.dataset.v));let now=new Date(),iso=now.toISOString().slice(0,10);$('#date').value=iso;$('#date').max=iso;$('#month').value=iso.slice(0,7);$('#month').onchange=stats;load();
</script></body></html>
